<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>Entrar | EVOS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 80% -10%,#553315,#111318 34%,#07080b 72%);color:#f8f5ee}.wrap{width:min(620px,calc(100% - 28px));margin:auto;padding:32px 0}.brand{font-size:36px;font-weight:950;letter-spacing:7px;color:#efcb72;text-decoration:none}.card{margin-top:28px;padding:24px;border:1px solid #ffffff18;border-radius:24px;background:#111319}.tag{font-size:11px;color:#efcb72;font-weight:900;letter-spacing:1px}.card h1{font-size:clamp(34px,7vw,54px);margin:8px 0 12px}.muted{color:#a8adb6;line-height:1.55}label{display:grid;gap:7px;margin-top:13px;color:#b9bec6;font-size:13px}input{width:100%;min-height:52px;border-radius:13px;border:1px solid #444a53;background:#0b0d11;color:#fff;padding:0 13px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.btn{min-height:52px;border:0;border-radius:13px;font:inherit;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#fff0ad,#d99b2c);color:#171109}.btn.dark{background:#202329;color:#fff;border:1px solid #50545d}.state{margin-top:14px;padding:12px;border-radius:12px;background:#17150f;border:1px solid #5e512d;color:#e7d28a}.state.error{background:#211111;border-color:#703b3b;color:#ffcaca}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="brand" href="/">EVOS</a><section class="card"><div class="tag">CUENTA EVOS</div><h1>Entra y continúa.</h1><p class="muted" id="context">Tu reserva queda guardada mientras accedes.</p><label>Email<input id="email" type="email" autocomplete="email" placeholder="tu@email.com"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres"></label><div class="grid"><button class="btn" id="login">ENTRAR</button><button class="btn dark" id="signup">CREAR CUENTA</button></div><div id="state" class="state">Conectando con EVOS…</div></section></main><script>let sb;const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const rawReturn=params.get('return')||localStorage.getItem('evos_return')||'/member';function safeReturn(v){try{const u=new URL(v,location.origin);return u.origin===location.origin?u.pathname+u.search:'/member'}catch{return'/member'}}const returnTo=safeReturn(rawReturn);localStorage.setItem('evos_return',returnTo);if(returnTo.startsWith('/reserve'))$('context').textContent='Tu servicio ya está elegido. Entra y volverás directamente a terminar la reserva.';function state(t,e=false){$('state').textContent=t;$('state').className=e?'state error':'state'}async function finish(){localStorage.removeItem('evos_return');location.replace(returnTo)}async function init(){try{const r=await fetch('/api/config',{cache:'no-store'}),c=await r.json();if(!r.ok||!c.ok)throw new Error(c.error||'Configuración no disponible');sb=supabase.createClient(c.url,c.anonKey);const s=await sb.auth.getSession();if(s.data.session?.user)return finish();state('✓ EVOS listo. Entra o crea tu cuenta.')}catch(e){state('No se pudo iniciar EVOS: '+e.message,true)}}$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return state('Escribe email y contraseña.',true);state('Entrando…');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return state(error.message,true);finish()};$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return state('Escribe un email y una contraseña de al menos 6 caracteres.',true);state('Creando cuenta…');const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/start?return='+encodeURIComponent(returnTo)}});if(error)return state(error.message,true);if(data.session)return finish();state('Cuenta creada. Revisa tu email para confirmarla y después vuelve a entrar.')} ;init();</script></body></html>
