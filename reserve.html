<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Reservar | EVOS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--gold:#efcb72;--muted:#9da3ad;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#f6f3ec;background:radial-gradient(circle at 70% -10%,#3b2911,#111216 32%,#07080a 70%);min-height:100vh}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.brand{font-size:32px;letter-spacing:6px;font-weight:950;color:var(--gold);text-decoration:none}.back{color:#ddd;text-decoration:none;border:1px solid var(--line);padding:10px 13px;border-radius:12px}.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#ffffff0b,#ffffff04);padding:24px}.tag{font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}.card h1{font-size:clamp(32px,6vw,50px);margin:8px 0 7px}.pro{font-size:18px;color:#d5d7dc}.desc{color:var(--muted);line-height:1.55}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.summary div{padding:12px;border:1px solid var(--line);border-radius:14px;background:#ffffff05}.summary b{display:block;color:var(--gold);font-size:16px}.summary span{font-size:12px;color:#9da3ad}label{display:grid;gap:7px;color:#b9bec6;margin-top:13px;font-size:13px}input,textarea{width:100%;border:1px solid #454951;border-radius:12px;background:#0e1014;color:#fff;padding:13px;font:inherit}textarea{min-height:95px;resize:vertical}.btn{width:100%;margin-top:17px;min-height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,#fff0ad,#d99b2c);color:#171109;font-weight:900;cursor:pointer}.btn:disabled{opacity:.6}.state{margin:15px 0;padding:13px;border-radius:13px;border:1px solid #5e512d;color:#e7d28a;background:#17150f}.state.error{border-color:#703b3b;color:#ffcaca;background:#211111}.login{display:inline-flex;text-decoration:none;background:linear-gradient(135deg,#fff0ad,#d99b2c);color:#171109;font-weight:900;padding:12px 16px;border-radius:12px}@media(max-width:560px){.summary{grid-template-columns:1fr}.card{padding:18px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/marketplace">EVOS</a><a class="back" href="/marketplace">← Servicios</a></header><div id="state" class="state">Preparando tu reserva…</div><section id="card" class="card" hidden><div class="tag" id="category"></div><h1 id="serviceName"></h1><div class="pro" id="professional"></div><p class="desc" id="description"></p><div class="summary"><div><b id="duration"></b><span>Duración</span></div><div><b id="price"></b><span>Precio</span></div><div><b id="modality"></b><span>Modalidad</span></div></div><form id="form"><label>Fecha y hora<input id="when" type="datetime-local" required></label><label>Qué quieres trabajar<textarea id="notes" maxlength="600" placeholder="Objetivo o información útil para el profesional"></textarea></label><button class="btn" id="submit" type="submit">CONFIRMAR RESERVA</button></form></section></main><script>let sb,user,item;const $=id=>document.getElementById(id);const money=(c,cur='EUR')=>new Intl.NumberFormat('es-ES',{style:'currency',currency:cur}).format(Number(c||0)/100);const fmt=v=>new Intl.DateTimeFormat('es-ES',{dateStyle:'full',timeStyle:'short'}).format(new Date(v));function setState(t,e=false){$('state').className=e?'state error':'state';$('state').innerHTML=t}function localValue(d){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,16)}async function init(){try{const ps=new URLSearchParams(location.search).get('ps');if(!ps)throw new Error('Falta el servicio profesional');const cr=await fetch('/api/config'),c=await cr.json();if(!c.ok)throw new Error(c.error||'Config');sb=supabase.createClient(c.url,c.anonKey);const session=await sb.auth.getSession();user=session.data.session?.user;if(!user){setState('Necesitas tu Cuenta EVOS para reservar.<br><br><a class="login" href="/#auth">INICIAR SESIÓN</a>');return}const q=await sb.from('evos_marketplace_services').select('*').eq('professional_service_id',ps).single();if(q.error)throw q.error;item=q.data;$('category').textContent=item.category;$('serviceName').textContent=item.service_name;$('professional').textContent='con '+item.professional_name+(item.featured?' · ★ EVOS destacado':'');$('description').textContent=item.description||item.headline||'Servicio EVOS personalizado';$('duration').textContent=item.duration_minutes+' min';$('price').textContent=money(item.price_cents,item.currency);$('modality').textContent=item.modality==='both'?'Online / presencial':item.modality==='online'?'Online':'Presencial';$('when').min=localValue(new Date(Date.now()+30*60000));$('card').hidden=false;setState('● Sesión EVOS activa · '+user.email)}catch(e){setState('No se pudo preparar la reserva: '+e.message,true)}}$('form').addEventListener('submit',async e=>{e.preventDefault();if(!user||!item)return;const starts=new Date($('when').value);if(!Number.isFinite(starts.getTime())||starts.getTime()<Date.now()+30*60000)return setState('Elige una fecha futura con al menos 30 minutos de margen.',true);if(!confirm(`Reservar ${item.service_name} con ${item.professional_name} el ${fmt(starts)} por ${money(item.price_cents,item.currency)}?`))return;$('submit').disabled=true;$('submit').textContent='RESERVANDO…';try{const r=await sb.from('evos_user_bookings').insert({user_id:user.id,service_id:item.catalog_service_id,professional_service_id:item.professional_service_id,starts_at:starts.toISOString(),notes:$('notes').value.trim()||null,status:'pending',origin:'marketplace'}).select('id,status,gross_amount_cents,evos_fee_cents,professional_net_cents,currency').single();if(r.error)throw r.error;setState('✓ Reserva registrada. La cita ya está en tu agenda EVOS.');$('form').innerHTML=`<a class="login" href="/booking">VER MIS CITAS</a>`}catch(err){setState('No se pudo reservar: '+err.message,true);$('submit').disabled=false;$('submit').textContent='CONFIRMAR RESERVA'}});init()</script></body></html>
