<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>EVOS Agent Suite</title>
<meta name="description" content="EVOS Agent Suite: recepcionista y agente comercial multidioma para negocios.">
<style>
:root{--bg:#07080a;--panel:#101216;--panel2:#15181d;--text:#f6f3ec;--muted:#9da3ad;--gold:#efcb72;--gold2:#d89b31;--line:#ffffff16;--ok:#baf0c4;--danger:#ffc1bd}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:radial-gradient(circle at 76% -12%,#4b3314 0,#121317 31%,var(--bg) 70%);color:var(--text)}button,input,textarea,select{font:inherit}.wrap{width:min(1180px,calc(100% - 24px));margin:auto;padding:18px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.logo{font-weight:950;letter-spacing:7px;font-size:32px;color:var(--gold)}.modeTabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.tab{border:1px solid var(--line);background:#15171b;color:#ddd;border-radius:999px;padding:9px 12px;cursor:pointer;font-size:12px;font-weight:850}.tab.active{background:linear-gradient(135deg,#fff0aa,var(--gold2));color:#16110a;border-color:transparent}.hero{display:grid;grid-template-columns:1fr .95fr;gap:24px;align-items:start;margin-top:20px}.intro,.app,.panel{border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,#ffffff0c,#ffffff04);box-shadow:0 30px 80px #0007}.intro{padding:30px;position:sticky;top:16px}.eyebrow{font-size:11px;font-weight:900;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase}.intro h1{font-size:clamp(40px,6vw,68px);line-height:1;margin:9px 0 13px;letter-spacing:-2.3px}.intro p{color:#bec1c8;line-height:1.6}.benefits{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}.benefit{padding:13px;border:1px solid #ffffff11;border-radius:15px;background:#0d0f12}.benefit b{display:block;color:#f2d88e;margin-bottom:4px}.benefit span{font-size:12px;color:#949aa4;line-height:1.4}.lang{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.lang button{border:1px solid #ffffff18;border-radius:999px;background:#101216;color:#cfd2d7;padding:8px 10px;cursor:pointer}.lang button.active{border-color:#8f773e;color:#f5db92;background:#19160f}.app{overflow:hidden}.appHead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.agent{display:flex;align-items:center;gap:11px}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fff0bb,#c8922b 45%,#302009 72%);color:#17110a;font-weight:950}.status{font-size:12px;color:#9ca2ac}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8fd29a;margin-right:5px}.chat{min-height:390px;max-height:520px;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.msg{display:flex}.bubble{max-width:84%;padding:12px 14px;border-radius:16px;line-height:1.48;font-size:14px}.bot .bubble{background:#17191e;border:1px solid #ffffff10}.me{justify-content:flex-end}.me .bubble{background:linear-gradient(135deg,#f3d78f,#d19a34);color:#17110b}.suggestions{display:grid;gap:8px}.svc{width:100%;text-align:left;border:1px solid #3b382f;border-radius:13px;background:#111318;color:#eee;padding:11px 12px;cursor:pointer}.svc:hover{border-color:#8f7438}.svc b{display:block;color:#f0d58c}.svc small{color:#959ba5}.composer{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;border:1px solid #424750;background:#0d0f12;color:#fff;border-radius:12px;padding:12px 13px}.composer button,.primary{border:0;border-radius:12px;background:linear-gradient(135deg,#fff0aa,var(--gold2));color:#17110a;font-weight:950;padding:0 16px;cursor:pointer}.leadForm{padding:17px;border-top:1px solid var(--line);background:#0b0d10}.leadForm h3{margin:0 0 4px}.leadForm p{margin:0 0 12px;color:#989ea8;font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fields input,.fields textarea,.fields select{width:100%;border:1px solid #3d424a;border-radius:11px;background:#111318;color:#fff;padding:11px}.fields textarea{grid-column:1/-1;min-height:86px;resize:vertical}.wide{grid-column:1/-1}.primary{min-height:48px;margin-top:10px;width:100%}.result{padding:14px;border-radius:14px;margin-top:10px;border:1px solid #3c5f43;background:#0e1710;color:#d7f3db;font-size:13px;line-height:1.5}.result.error{border-color:#704242;background:#211111;color:var(--danger)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric{padding:13px;border:1px solid #ffffff11;border-radius:14px;background:#0d0f12}.metric b{display:block;font-size:21px;color:var(--gold)}.metric span{font-size:11px;color:#8f959f}.fine{margin-top:12px;color:#757b84;font-size:11px;line-height:1.5}@media(max-width:900px){.hero{grid-template-columns:1fr}.intro{position:static}.benefits{grid-template-columns:1fr 1fr}}@media(max-width:560px){.top{align-items:flex-start}.logo{font-size:24px}.modeTabs{justify-content:flex-start}.intro{padding:22px}.benefits,.metrics,.fields{grid-template-columns:1fr}.fields textarea,.wide{grid-column:auto}.chat{min-height:340px}.bubble{max-width:92%}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="logo">EVOS</div><div class="modeTabs"><button class="tab" data-mode="evos">EVOS BUSINESS</button><button class="tab" data-mode="portes">PORTES & MONTAJES</button><button class="tab" data-mode="training">EVOS TRAINING</button></div></header>
<div class="hero">
<section class="intro">
<div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="lead"></p>
<div class="benefits" id="benefits"></div>
<div class="lang"><button data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="it">IT</button><button data-lang="fr">FR</button></div>
<div class="metrics"><div class="metric"><b>24/7</b><span id="m1"></span></div><div class="metric"><b>&lt;1 min</b><span id="m2"></span></div><div class="metric"><b>1 motor</b><span id="m3"></span></div></div>
<div class="fine" id="fine"></div>
</section>
<section class="app">
<div class="appHead"><div class="agent"><div class="avatar">E</div><div><b id="agentName">EVOS Agent</b><div class="status"><span class="dot"></span><span id="status"></span></div></div></div><div class="eyebrow" id="sectorLabel"></div></div>
<div class="chat" id="chat"></div>
<div class="composer"><input id="message" maxlength="1200"><button id="send">→</button></div>
<div class="leadForm" id="leadForm" hidden><h3 id="formTitle"></h3><p id="formLead"></p><div class="fields" id="fields"></div><button class="primary" id="submitLead"></button><div id="result"></div></div>
</section>
</div>
</main>
<script>
const WHATSAPP='34645772010';
const copy={
 es:{online:'En línea · responde al instante',m1:'atención disponible',m2:'objetivo de respuesta',m3:'para varios negocios',fine:'Piloto EVOS. La IA no inventa precios, disponibilidad ni resultados. Las confirmaciones finales y trabajos sensibles pueden escalarse a una persona.',placeholder:'Escribe lo que necesitas…',formTitle:'Deja lo mínimo y EVOS prepara el siguiente paso',formLead:'Usaremos estos datos únicamente para atender esta solicitud.',submit:'PREPARAR SIGUIENTE PASO →',saved:'Solicitud registrada en EVOS.',wa:'CONTINUAR POR WHATSAPP →',error:'No se pudo guardar automáticamente. Puedes continuar por WhatsApp.'},
 en:{online:'Online · replies instantly',m1:'service availability',m2:'response target',m3:'for multiple businesses',fine:'EVOS pilot. The AI does not invent prices, availability or outcomes. Final confirmations and sensitive work can be escalated to a person.',placeholder:'Tell me what you need…',formTitle:'Leave the minimum details and EVOS will prepare the next step',formLead:'We use these details only to handle this request.',submit:'PREPARE NEXT STEP →',saved:'Request registered in EVOS.',wa:'CONTINUE ON WHATSAPP →',error:'Automatic save failed. You can continue on WhatsApp.'},
 it:{online:'Online · risponde subito',m1:'assistenza disponibile',m2:'obiettivo di risposta',m3:'per più attività',fine:'Pilota EVOS. L’IA non inventa prezzi, disponibilità o risultati. Le conferme finali e i casi sensibili possono essere passati a una persona.',placeholder:'Scrivi ciò di cui hai bisogno…',formTitle:'Lascia i dati minimi ed EVOS prepara il prossimo passo',formLead:'Useremo questi dati solo per gestire questa richiesta.',submit:'PREPARA IL PROSSIMO PASSO →',saved:'Richiesta registrata in EVOS.',wa:'CONTINUA SU WHATSAPP →',error:'Salvataggio automatico non riuscito. Puoi continuare su WhatsApp.'},
 fr:{online:'En ligne · répond immédiatement',m1:'service disponible',m2:'objectif de réponse',m3:'pour plusieurs activités',fine:'Pilote EVOS. L’IA n’invente ni prix, ni disponibilité, ni résultat. Les confirmations finales et les cas sensibles peuvent être transmis à une personne.',placeholder:'Écrivez ce dont vous avez besoin…',formTitle:'Laissez le minimum et EVOS prépare la prochaine étape',formLead:'Ces données servent uniquement à traiter cette demande.',submit:'PRÉPARER LA SUITE →',saved:'Demande enregistrée dans EVOS.',wa:'CONTINUER SUR WHATSAPP →',error:'Enregistrement automatique impossible. Vous pouvez continuer sur WhatsApp.'}
};
const modes={
 evos:{sector:'business automation',label:'EVOS BUSINESS AGENT',title:'Convierte tareas repetitivas en procesos automáticos.',lead:'Recepción, ventas, agenda y seguimiento con una sola plataforma configurable.',benefits:['Atiende y cualifica leads','Agenda y deriva a humano','Registra oportunidades','Multidioma desde el mismo motor'],hello:{es:'Hola. Soy EVOS Business Agent. Cuéntame qué proceso quieres automatizar o qué problema quieres resolver.',en:'Hi. I’m EVOS Business Agent. Tell me which process you want to automate or what problem you want to solve.',it:'Ciao. Sono EVOS Business Agent. Dimmi quale processo vuoi automatizzare o quale problema vuoi risolvere.',fr:'Bonjour. Je suis EVOS Business Agent. Dites-moi quel processus vous souhaitez automatiser ou quel problème vous voulez résoudre.'},catalog:[{id:'reception',name:'Recepción IA',description:'Atención, FAQs, cualificación y derivación.',price:0,duration:0,keywords:['recepcion','atencion','whatsapp','llamadas','clientes','consultas','reception','customer service']},{id:'sales',name:'Agente de ventas y seguimiento',description:'Lead recovery, scoring, seguimiento y agenda.',price:0,duration:0,keywords:['ventas','leads','seguimiento','crm','sales','follow up']},{id:'automation',name:'Automatización de procesos',description:'Conecta formularios, CRM, agenda y tareas administrativas.',price:0,duration:0,keywords:['automatizar','proceso','administracion','crm','automation','workflow']}],fields:['company','name','phone','email','details']},
 portes:{sector:'transport and assembly',label:'PORTES & MONTAJES · AGENTE DIGITAL',title:'Pide tu presupuesto sin formularios interminables.',lead:'EVOS entiende qué necesitas, recoge solo los datos importantes y deja el trabajo preparado para confirmar.',benefits:['Portes y transporte','Montaje y desmontaje','Mudanzas y recogidas','Presupuesto guiado'],hello:{es:'Hola. Soy el asistente de Portes & Montajes. Dime qué necesitas transportar, montar, recoger o trasladar.',en:'Hi. I’m the Portes & Montajes assistant. Tell me what you need to move, transport, collect or assemble.',it:'Ciao. Sono l’assistente Portes & Montajes. Dimmi cosa devi trasportare, ritirare, montare o traslocare.',fr:'Bonjour. Je suis l’assistant Portes & Montajes. Dites-moi ce que vous devez transporter, récupérer, monter ou déménager.'},catalog:[{id:'transport',name:'Transporte / porte',description:'Traslado de objetos y cargas con presupuesto personalizado.',price:0,duration:0,keywords:['transportar','porte','llevar','mueble','carga','transport','trasporto']},{id:'assembly',name:'Montaje / desmontaje',description:'Montaje o desmontaje de muebles y elementos.',price:0,duration:0,keywords:['montar','montaje','desmontar','mueble','assembly','montaggio']},{id:'moving',name:'Mudanza',description:'Traslado de vivienda, habitación, oficina o varios objetos.',price:0,duration:0,keywords:['mudanza','casa','piso','habitacion','moving','trasloco','demenagement']},{id:'collection',name:'Recogida',description:'Recogida y entrega de compras, muebles u objetos.',price:0,duration:0,keywords:['recoger','recogida','wallapop','tienda','collection','ritiro']}],fields:['name','phone','origin','destination','date','details']},
 training:{sector:'personal training',label:'EVOS TRAINING · TRAINER AGENT',title:'Tu primer paso de entrenamiento, claro y personalizado.',lead:'El agente entiende objetivo, modalidad y disponibilidad y te lleva a una valoración con un entrenador.',benefits:['Online o presencial','Objetivo y nivel','Seguimiento progresivo','Agenda de valoración'],hello:{es:'Hola. Soy EVOS Trainer. Cuéntame qué quieres conseguir y cómo entrenas ahora.',en:'Hi. I’m EVOS Trainer. Tell me what you want to achieve and how you train now.',it:'Ciao. Sono EVOS Trainer. Dimmi cosa vuoi ottenere e come ti alleni adesso.',fr:'Bonjour. Je suis EVOS Trainer. Dites-moi votre objectif et comment vous vous entraînez actuellement.'},catalog:[{id:'assessment',name:'Valoración inicial',description:'Objetivo, nivel, disponibilidad y punto de partida.',price:0,duration:30,keywords:['empezar','valoracion','objetivo','principiante','assessment','iniziare']},{id:'online',name:'Entrenamiento online',description:'Entrenamiento personal y seguimiento a distancia.',price:0,duration:60,keywords:['online','casa','remoto','remote','home']},{id:'personal',name:'Entrenamiento personal',description:'Sesión individual adaptada al objetivo y nivel.',price:0,duration:60,keywords:['personal','fuerza','adelgazar','forma','fitness','musculo']}],fields:['name','phone','email','goal','modality','availability','details']}
};
const labels={company:'Empresa',name:'Nombre',phone:'Teléfono',email:'Email',details:'Detalles importantes',origin:'Origen / recogida',destination:'Destino / entrega',date:'Fecha preferida',goal:'Objetivo principal',modality:'Online / presencial / mixto',availability:'Disponibilidad'};
const placeholders={company:'Nombre del negocio',name:'Tu nombre',phone:'Teléfono',email:'Email',details:'Añade solo lo necesario',origin:'Ciudad / dirección de origen',destination:'Ciudad / dirección de destino',date:'Ej.: viernes por la tarde',goal:'Ej.: ganar fuerza, perder grasa, volver a entrenar',modality:'Ej.: online',availability:'Ej.: lunes y miércoles 18:00'};
let mode=new URLSearchParams(location.search).get('mode')||'evos',lang=new URLSearchParams(location.search).get('lang')||'es',selected=null,lastMessage='';
if(!modes[mode])mode='evos';if(!copy[lang])lang='es';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function add(text,who='bot',html=false){const row=document.createElement('div');row.className='msg '+who;const b=document.createElement('div');b.className='bubble';html?b.innerHTML=text:b.textContent=text;row.appendChild(b);$('chat').appendChild(row);$('chat').scrollTop=$('chat').scrollHeight}
function render(){const m=modes[mode],c=copy[lang];document.documentElement.lang=lang;$('eyebrow').textContent=m.label;$('sectorLabel').textContent=m.label;$('title').textContent=m.title;$('lead').textContent=m.lead;$('benefits').innerHTML=m.benefits.map((x,i)=>`<div class="benefit"><b>${i+1}</b><span>${esc(x)}</span></div>`).join('');$('m1').textContent=c.m1;$('m2').textContent=c.m2;$('m3').textContent=c.m3;$('fine').textContent=c.fine;$('status').textContent=c.online;$('message').placeholder=c.placeholder;$('formTitle').textContent=c.formTitle;$('formLead').textContent=c.formLead;$('submitLead').textContent=c.submit;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));$('chat').innerHTML='';$('leadForm').hidden=true;selected=null;add(m.hello[lang]||m.hello.es);renderFields()}
function renderFields(){const c=modes[mode];$('fields').innerHTML=c.fields.map(key=>key==='details'?`<textarea data-field="${key}" placeholder="${esc(placeholders[key])}"></textarea>`:`<input data-field="${key}" ${key==='email'?'type="email"':key==='phone'?'type="tel"':'type="text"'} placeholder="${esc(labels[key])} · ${esc(placeholders[key])}">`).join('')}
function localMatch(message){const q=message.toLowerCase();return modes[mode].catalog.map(s=>({...s,score:s.keywords.filter(k=>q.includes(k.toLowerCase())).length})).sort((a,b)=>b.score-a.score).slice(0,2)}
async function ask(message){lastMessage=message.trim();if(!lastMessage)return;add(lastMessage,'me');$('message').value='';$('send').disabled=true;$('status').textContent='EVOS…';let data=null;try{const r=await fetch('/api/business-agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:lastMessage,sector:modes[mode].sector,language:lang,catalog:modes[mode].catalog})});data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'agent error')}catch(e){const recs=localMatch(lastMessage).map(x=>({id:x.id,reason:'EVOS'}));data={reply:copy[lang].error,recommendations:recs,mode:'local'}}add(data.reply||modes[mode].hello[lang]);const byId=new Map(modes[mode].catalog.map(x=>[x.id,x]));const recs=(data.recommendations||[]).map(r=>({...byId.get(r.id),reason:r.reason})).filter(x=>x.id);if(recs.length){const html='<div class="suggestions">'+recs.map(x=>`<button class="svc" data-service="${esc(x.id)}"><b>${esc(x.name)}</b><small>${x.duration?x.duration+' min · ':''}${x.price?x.price+' '+x.unit:'Presupuesto / propuesta personalizada'}</small></button>`).join('')+'</div>';add(html,'bot',true);document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>selectService(b.dataset.service))}else{$('leadForm').hidden=false}$('status').textContent=(copy[lang].online)+' · '+(data.mode||'EVOS');$('send').disabled=false}
function selectService(id){selected=modes[mode].catalog.find(x=>x.id===id);add(selected.name,'me');$('leadForm').hidden=false;$('leadForm').scrollIntoView({behavior:'smooth',block:'nearest'})}
async function submitLead(){const values={};document.querySelectorAll('[data-field]').forEach(el=>values[el.dataset.field]=el.value.trim());if(!values.name||!values.phone){$('result').className='result error';$('result').textContent='Nombre y teléfono son necesarios.';return}const summary=[`EVOS-${mode.toUpperCase()}`,selected?.name,lastMessage,...Object.entries(values).filter(([k,v])=>v&& !['name','phone','email'].includes(k)).map(([k,v])=>`${k}:${v}`)].filter(Boolean).join(' · ').slice(0,210);let saved=false;try{const r=await fetch('/api/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:values.name,email:values.email||null,phone:values.phone,status:summary})});const d=await r.json();saved=!!(r.ok&&d.ok)}catch{}const waText=[`Hola, soy ${values.name}.`,`EVOS ${mode.toUpperCase()}.`,selected?`Interés: ${selected.name}.`:'',lastMessage?`Necesidad: ${lastMessage}.`:'',...Object.entries(values).filter(([k,v])=>v&&!['name','phone','email'].includes(k)).map(([k,v])=>`${labels[k]||k}: ${v}.`)].filter(Boolean).join(' ');const wa=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(waText)}`;$('result').className='result';$('result').innerHTML=`<b>${esc(saved?copy[lang].saved:copy[lang].error)}</b><br><a href="${wa}" target="_blank" rel="noopener" style="display:inline-block;margin-top:9px;color:#f1d58d;font-weight:900">${esc(copy[lang].wa)}</a>`}
$('send').onclick=()=>ask($('message').value);$('message').addEventListener('keydown',e=>{if(e.key==='Enter')ask($('message').value)});$('submitLead').onclick=submitLead;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;history.replaceState(null,'',`?mode=${mode}&lang=${lang}`);render()});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;history.replaceState(null,'',`?mode=${mode}&lang=${lang}`);render()});render();
</script>
</body>
</html>
