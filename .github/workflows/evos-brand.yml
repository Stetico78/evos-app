name: Apply EVOS Brand

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/evos-brand.jpg'

permissions:
  contents: write

jobs:
  brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add shared EVOS brand loader to all HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          changed = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              if 'data-evos-brand' in text or 'evos-brand.js' in text:
                  continue
              src = os.path.relpath('evos-brand.js', p.parent).replace(os.sep, '/')
              tag = f'<script src="{src}" data-evos-brand></script>'
              if re.search(r'</body\s*>', text, flags=re.I):
                  text = re.sub(r'</body\s*>', tag + '\n</body>', text, count=1, flags=re.I)
              else:
                  text += '\n' + tag + '\n'
              p.write_text(text, encoding='utf-8')
              changed.append(str(p))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit global EVOS branding
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No branding changes needed.'
            exit 0
          fi
          git config user.name 'EVOS Brand Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html' '**/*.html' || true
          git commit -m 'Apply EVOS brand globally'
          git push
