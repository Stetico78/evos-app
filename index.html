<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EVOS · Acceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#070913;--card:#11162a;--line:#29304a;--text:#f6f7fb;--muted:#aeb6ce;--violet:#9a72ff;--cyan:#55d8ff}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,system-ui,Arial;background:linear-gradient(145deg,#10152b,#070913);color:var(--text)}
    .wrap{width:min(960px,calc(100% - 32px));margin:auto;padding:34px 0}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
    .logo{font-size:24px;font-weight:1000;letter-spacing:.14em}.logo span{color:var(--cyan)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:rgba(17,22,42,.92);border:1px solid var(--line);border-radius:22px;padding:24px}
    h1{font-size:42px;margin:0 0 10px} h2{margin-top:0} p{color:var(--muted);line-height:1.55}
    label{display:block;margin:13px 0 6px;color:var(--muted);font-weight:700} input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0b1020;color:white}
    button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,var(--violet),var(--cyan));color:#07101a}
    button.secondary{background:#171d34;color:white;border:1px solid var(--line)}
    .status{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);white-space:pre-wrap}.hidden{display:none}
    @media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:34px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">EV<span>OS</span></div><div>Área privada</div></div>
  <div class="grid">
    <section class="card">
      <h1>Entra en EVOS</h1>
      <p>Registro, acceso y sesión conectados a Supabase.</p>
      <label>Email</label><input id="email" type="email" autocomplete="email">
      <label>Contraseña</label><input id="password" type="password" autocomplete="current-password">
      <button id="login">Entrar</button>
      <button id="signup" class="secondary">Crear cuenta</button>
      <div id="status" class="status">Comprobando conexión…</div>
    </section>

    <section class="card">
      <h2>Perfil EVOS</h2>
      <div id="loggedout"><p>Cuando inicies sesión verás aquí tu usuario y podremos conectar después objetivos, servicios, comunidad, reservas y EVOS Paid Time.</p></div>
      <div id="loggedin" class="hidden">
        <p>Sesión activa:</p>
        <p id="user"></p>
        <button id="logout" class="secondary">Cerrar sesión</button>
      </div>
    </section>
  </div>
</div>
<script>
let sb;

const $ = id => document.getElementById(id);
function msg(text){ $('status').textContent = text; }

async function init(){
  try{
    const r = await fetch('/api/config');
    const c = await r.json();
    if(!r.ok || !c.ok) throw new Error(c.error || 'No se pudo leer configuración');
    sb = supabase.createClient(c.url, c.anonKey);
    const { data, error } = await sb.auth.getSession();
    if(error) throw error;
    msg('Conexión Supabase OK');
    render(data.session);
    sb.auth.onAuthStateChange((_e, session)=>render(session));
  }catch(e){ msg('ERROR: ' + e.message); }
}

function render(session){
  if(session){
    $('loggedout').classList.add('hidden');
    $('loggedin').classList.remove('hidden');
    $('user').textContent = session.user.email + ' · ' + session.user.id;
  }else{
    $('loggedout').classList.remove('hidden');
    $('loggedin').classList.add('hidden');
  }
}

$('signup').onclick = async ()=>{
  if(!sb) return msg('Supabase todavía no está listo');
  const email=$('email').value.trim(), password=$('password').value;
  const {data,error}=await sb.auth.signUp({email,password});
  if(error) return msg('ERROR registro: '+error.message);
  msg(data.session ? 'Cuenta creada y sesión iniciada.' : 'Cuenta creada. Revisa tu email si Supabase exige confirmación.');
};

$('login').onclick = async ()=>{
  if(!sb) return msg('Supabase todavía no está listo');
  const email=$('email').value.trim(), password=$('password').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  msg(error ? 'ERROR acceso: '+error.message : 'Acceso correcto.');
};

$('logout').onclick = async ()=>{ if(sb){ await sb.auth.signOut(); msg('Sesión cerrada.'); } };

init();
</script>
</body>
</html>
