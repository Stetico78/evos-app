<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>EVOS Perfil</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#3b4049 0,#14171c 34%,#07080a 72%);color:#f5f5f5;min-height:100vh}.app{width:min(1100px,94%);margin:auto;padding:28px 0}.logo{font-size:42px;font-weight:950;letter-spacing:7px;color:#ead077}.sub{color:#999;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{border:1px solid #ffffff17;background:linear-gradient(145deg,#ffffff12,#ffffff05);border-radius:20px;padding:20px}.gold{color:#ead077}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.metric{padding:12px 0;border-bottom:1px solid #2f3338}.metric span{color:#999}.metric b{float:right;color:#ead077}.bar{height:9px;background:#1c1f24;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6b5522,#ead077)}button,a.btn{display:inline-block;border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#fff0a6,#c69231);color:#17120a;text-decoration:none}.back{background:#24272d!important;color:#eee!important;border:1px solid #555!important}.notice{padding:12px;border:1px solid #5e512d;border-radius:12px;color:#e4cd82;margin-bottom:14px}.rec{padding:16px;border:1px solid #8d7539;border-radius:15px;background:#17140d;margin-top:12px}.muted{color:#888}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="row"><div><div class="logo">EVOS PROFILE</div><div class="sub">Tu mapa de evolución continuo</div></div><a class="btn back" href="/">← EVOS</a></div><div id="state" class="notice">Conectando…</div><div class="grid"><section class="box"><h3 class="gold">Perfil</h3><div id="profile">Cargando…</div><div style="margin-top:16px"><a class="btn" href="/">ACTUALIZAR TEST</a></div></section><section class="box"><h3 class="gold">Última medición</h3><div id="scores">Cargando…</div></section><section class="box"><h3 class="gold">Recomendación EVOS</h3><div id="recommendation" class="muted">Todavía no hay recomendación.</div></section><section class="box"><h3 class="gold">Próximos pasos</h3><p class="muted">Convierte tu recomendación en acción y reserva una sesión cuando necesites acompañamiento.</p><a class="btn" href="/booking">ABRIR AGENDA</a></section></div></div><script>let sb,user;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const labels={body:'Cuerpo',mind:'Mente',emotion:'Emoción',relationships:'Relaciones',purpose:'Propósito'};async function init(){try{const c=await fetch('/api/config').then(r=>r.json());sb=supabase.createClient(c.url,c.anonKey);const s=await sb.auth.getSession();user=s.data.session?.user;if(!user){state.textContent='Necesitas iniciar sesión en EVOS.';profile.innerHTML='<a class="btn" href="/">IR A CUENTA EVOS</a>';scores.textContent='Sin sesión';return}state.textContent='● Perfil EVOS conectado · '+user.email;const p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error)throw p.error;const a=await sb.from('assessments').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();profile.innerHTML=`<strong class="gold">${esc(p.data?.full_name||p.data?.display_name||user.user_metadata?.full_name||user.email)}</strong><p>Objetivo: ${esc(p.data?.primary_goal||'Pendiente')}</p><p>Área prioritaria: ${esc(labels[p.data?.dominant_area]||p.data?.dominant_area||'Pendiente')}</p><p>Nivel EVOS: ${esc(p.data?.evos_level||1)}</p>`;if(!a.data){scores.textContent='Completa tu primer Test EVOS.';return}const vals={body:a.data.body_score,mind:a.data.mind_score,emotion:a.data.emotion_score,relationships:a.data.relationships_score,purpose:a.data.purpose_score};scores.innerHTML=Object.entries(vals).map(([k,v])=>`<div class="metric"><span>${labels[k]}</span><b>${v??'—'}</b><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(v)||0))}%"></i></div></div>`).join('');let rec=await sb.from('ai_recommendations').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();if(!rec.data){const r=await fetch('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scores:vals,goal:p.data?.primary_goal||'',dominant_area:a.data.dominant_area})}).then(x=>x.json());if(r.ok){const ins=await sb.from('ai_recommendations').insert({user_id:user.id,assessment_id:a.data.id,title:r.title,recommendation:r.recommendation,next_action:r.next_action,priority:r.priority,status:'active',model:r.mode==='fallback'?'evos-rule-engine':'gemini'}).select().single();if(!ins.error)rec={data:ins.data}}}if(rec.data)recommendation.innerHTML=`<div class="rec"><strong class="gold">${esc(rec.data.title)}</strong><p>${esc(rec.data.recommendation)}</p><p><b>Siguiente acción:</b> ${esc(rec.data.next_action||'')}</p><small>Prioridad ${esc(rec.data.priority)}/5</small></div>`}catch(e){state.textContent='Error: '+e.message}}init();</script></body></html>
