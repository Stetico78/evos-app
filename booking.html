<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>EVOS Agenda</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#3b4049 0,#14171c 34%,#07080a 72%);color:#f5f5f5;min-height:100vh}.app{width:min(1050px,94%);margin:auto;padding:28px 0}.logo{font-size:42px;font-weight:950;letter-spacing:7px;color:#ead077}.sub{color:#999;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.box{border:1px solid #ffffff17;background:linear-gradient(145deg,#ffffff12,#ffffff05);border-radius:20px;padding:20px}.gold{color:#ead077}input,select,textarea{width:100%;padding:13px;margin:0 0 10px;border-radius:10px;border:1px solid #444;background:#111318;color:#fff}button,a.btn{display:inline-block;border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#fff0a6,#c69231);color:#17120a;text-decoration:none}.back{background:#24272d!important;color:#eee!important;border:1px solid #555!important}.item{padding:14px 0;border-bottom:1px solid #333}.item strong{color:#f0d681}.item small{display:block;color:#999;margin-top:5px}.notice{padding:12px;border:1px solid #5e512d;border-radius:12px;color:#e4cd82;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="row"><div><div class="logo">EVOS AGENDA</div><div class="sub">Reserva tu siguiente paso</div></div><a class="btn back" href="/">← EVOS</a></div><div id="state" class="notice">Conectando…</div><div class="grid"><section class="box"><h3 class="gold">Nueva reserva</h3><select id="service"></select><input id="when" type="datetime-local"><textarea id="notes" rows="4" placeholder="Objetivo o nota para la sesión"></textarea><button onclick="book()">RESERVAR</button></section><section class="box"><h3 class="gold">Mis próximas reservas</h3><div id="list">Cargando…</div></section></div></div><script>let sb,user,services=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function init(){try{const c=await fetch('/api/config').then(r=>r.json());sb=supabase.createClient(c.url,c.anonKey);const s=await sb.auth.getSession();user=s.data.session?.user;if(!user){state.textContent='Necesitas iniciar sesión en EVOS antes de reservar.';list.innerHTML='<a class="btn" href="/">IR A CUENTA EVOS</a>';return}state.textContent='● Sesión EVOS activa · '+user.email;const q=await sb.from('evos_catalog_services').select('*').eq('active',true).order('name');if(q.error)throw q.error;services=q.data||[];service.innerHTML=services.map(x=>`<option value="${x.id}">${esc(x.name)} · ${(x.price_cents/100).toFixed(0)} ${esc(x.currency)} · ${x.duration_minutes} min</option>`).join('');await load()}catch(e){state.textContent='Error: '+e.message}}async function load(){const q=await sb.from('evos_user_bookings').select('id,starts_at,status,notes,evos_catalog_services(name,duration_minutes,price_cents,currency)').eq('user_id',user.id).gte('starts_at',new Date().toISOString()).order('starts_at');if(q.error){list.textContent=q.error.message;return}list.innerHTML=q.data?.length?q.data.map(b=>`<div class="item"><strong>${esc(b.evos_catalog_services?.name||'Servicio')}</strong><small>${new Date(b.starts_at).toLocaleString()} · ${esc(b.status)}</small>${b.notes?`<small>${esc(b.notes)}</small>`:''}</div>`).join(''):'<div style="color:#777">Todavía no tienes reservas.</div>'}async function book(){if(!user)return;const dt=when.value;if(!dt)return alert('Elige fecha y hora.');const q=await sb.from('evos_user_bookings').insert({user_id:user.id,service_id:service.value,starts_at:new Date(dt).toISOString(),notes:notes.value.trim()||null}).select().single();if(q.error)return alert(q.error.message);notes.value='';state.textContent='✓ Reserva registrada en EVOS';await load()}init();</script></body></html>
