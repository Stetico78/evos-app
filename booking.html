<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <title>Agenda | EVOS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/booking-rules.js"></script>
  <style>
    *{box-sizing:border-box}[hidden]{display:none!important}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#3b4049 0,#14171c 34%,#07080a 72%);color:#f5f5f5}.app{width:min(1080px,94%);margin:auto;padding:28px 0 86px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.logo{font-size:clamp(32px,6vw,46px);font-weight:950;letter-spacing:clamp(4px,1vw,7px);color:#ead077}.sub{color:#9ca1aa;margin-top:5px}.nav{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(0,1.4fr);gap:18px}.box{border:1px solid #ffffff17;background:linear-gradient(145deg,#ffffff12,#ffffff05);border-radius:20px;padding:20px;min-width:0}.gold{color:#ead077}.muted{color:#9298a2}.notice{padding:12px 14px;border:1px solid #5e512d;border-radius:12px;color:#e4cd82;margin-bottom:18px;background:#19170f}.notice.error{border-color:#743b3b;color:#ffcaca;background:#211111}label{display:grid;gap:6px;color:#b5bac3;font-size:13px;margin-bottom:11px}input,select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #41454c;background:#101217;color:#fff;font:inherit}textarea{resize:vertical;min-height:92px}input:focus,select:focus,textarea:focus{outline:2px solid #b99a4d;outline-offset:1px}button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#fff0a6,#c69231);color:#17120a;text-decoration:none}.secondary{background:#24272d;color:#eee;border:1px solid #555}.danger{background:#3a1717;color:#ffd6d6;border:1px solid #7a3a3a}button:disabled{opacity:.55;cursor:wait}.service-info{padding:14px;border:1px solid #403a29;border-radius:13px;background:#15140f;margin:2px 0 14px}.service-info strong{color:#ead077}.service-info small{display:block;color:#a2a7af;margin-top:5px;line-height:1.45}.timezone{font-size:12px;color:#868c96;margin:-5px 0 14px}.item{padding:15px 0;border-bottom:1px solid #30343a}.item:first-child{padding-top:3px}.item:last-child{border-bottom:0}.item-head{display:flex;justify-content:space-between;gap:12px}.item strong{color:#f0d681}.item small{display:block;color:#999;margin-top:5px}.pill{height:max-content;border:1px solid #50482e;background:#19170f;color:#ddc77d;border-radius:999px;padding:5px 8px;font-size:11px;white-space:nowrap}.pill.cancelled{border-color:#663c3c;color:#db9a9a;background:#201313}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.actions button{min-height:39px;padding:8px 11px;font-size:12px}.reschedule{margin-top:11px;padding:13px;border:1px solid #444;border-radius:12px;background:#0d0f13}.hidden{display:none!important}.empty{color:#848a94;padding:18px 0}.mobile-nav{display:none}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #79652f;border-top-color:#f5dd8d;border-radius:50%;animation:spin .8s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:760px){.app{width:min(100% - 24px,1080px);padding-top:18px}.top{align-items:flex-start}.top .nav{display:none}.grid{grid-template-columns:1fr;gap:12px}.box{padding:17px;border-radius:17px}.logo{line-height:1.05}.sub{font-size:14px}.item-head{align-items:flex-start}.actions button{flex:1}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(3,1fr);left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;padding:7px;border:1px solid #ffffff20;border-radius:16px;background:#101217ed;backdrop-filter:blur(14px);box-shadow:0 10px 35px #000}.mobile-nav a{display:grid;place-items:center;min-height:46px;color:#b8bdc6;text-decoration:none;font-size:12px;font-weight:750;border-radius:10px}.mobile-nav a.active{color:#17120a;background:linear-gradient(135deg,#fff0a6,#c69231)}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div><div class="logo">EVOS AGENDA</div><div class="sub">Reserva, reprograma o cancela tu siguiente paso</div></div>
      <nav class="nav" aria-label="Navegación principal"><a class="btn secondary" href="/">INICIO</a><a class="btn secondary" href="/profile">MI PERFIL</a></nav>
    </header>

    <div id="state" class="notice" role="status" aria-live="polite"><span class="spinner"></span>Conectando con EVOS…</div>

    <main class="grid">
      <section class="box" aria-labelledby="newBookingTitle">
        <h2 id="newBookingTitle" class="gold">Nueva reserva</h2>
        <form id="bookingForm">
          <label>Servicio<select id="service" required><option value="">Cargando servicios…</option></select></label>
          <div id="serviceInfo" class="service-info muted">Selecciona un servicio.</div>
          <label>Fecha y hora<input id="when" type="datetime-local" required></label>
          <div id="timezone" class="timezone"></div>
          <label>Objetivo o nota<textarea id="notes" maxlength="600" placeholder="¿Qué quieres trabajar en la sesión?"></textarea></label>
          <button id="bookButton" type="submit">RESERVAR</button>
        </form>
      </section>

      <section class="box" aria-labelledby="bookingsTitle">
        <h2 id="bookingsTitle" class="gold">Mis reservas</h2>
        <div id="list">Cargando…</div>
      </section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Navegación móvil"><a href="/">Inicio</a><a href="/profile">Perfil</a><a class="active" href="/booking">Agenda</a></nav>

  <script>
    let sb;
    let user;
    let services = [];
    let bookingItems = [];
    let bookingBusy = false;

    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const statusText = {pending:'Pendiente',confirmed:'Confirmada',completed:'Completada',cancelled:'Cancelada'};
    const dateText = (value) => new Intl.DateTimeFormat('es-ES',{dateStyle:'full',timeStyle:'short'}).format(new Date(value));
    const money = (cents, currency = 'EUR') => new Intl.NumberFormat('es-ES',{style:'currency',currency}).format(Number(cents || 0) / 100);
    const localInputValue = (date) => {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0,16);
    };

    function setState(message, error = false) {
      $('state').className = error ? 'notice error' : 'notice';
      $('state').textContent = message;
    }

    function setMinimumDate() {
      const minimum = new Date(Date.now() + 30 * 60000);
      $('when').min = localInputValue(minimum);
      $('timezone').textContent = `Hora local: ${Intl.DateTimeFormat().resolvedOptions().timeZone || 'dispositivo'}`;
    }

    function renderService() {
      const item = services.find((entry) => entry.id === $('service').value);
      if (!item) {
        $('serviceInfo').textContent = services.length ? 'Selecciona un servicio.' : 'No hay servicios disponibles ahora.';
        return;
      }
      $('serviceInfo').innerHTML = `<strong>${esc(item.name)}</strong><small>${esc(item.description || 'Sesión personalizada EVOS')}</small><small>${item.duration_minutes} min · ${money(item.price_cents,item.currency)}</small>`;
    }

    function bookingRow(item) {
      const cancelled = item.status === 'cancelled';
      const completed = item.status === 'completed';
      const past = new Date(item.starts_at).getTime() <= Date.now();
      const canChange = !cancelled && !completed && !past;
      return `<article class="item" id="booking-${esc(item.id)}"><div class="item-head"><div><strong>${esc(item.evos_catalog_services?.name || 'Servicio EVOS')}</strong><small>${esc(dateText(item.starts_at))}</small>${item.notes ? `<small>${esc(item.notes)}</small>` : ''}</div><span class="pill ${cancelled ? 'cancelled' : ''}">${esc(statusText[item.status] || item.status)}</span></div>${canChange ? `<div class="actions"><button class="secondary" type="button" onclick="showReschedule('${esc(item.id)}')">REPROGRAMAR</button><button class="danger" type="button" onclick="cancelBooking('${esc(item.id)}')">CANCELAR</button></div><div id="res-${esc(item.id)}" class="reschedule hidden"><label>Nueva fecha y hora<input id="new-${esc(item.id)}" type="datetime-local" min="${esc($('when').min)}"></label><button type="button" onclick="rescheduleBooking('${esc(item.id)}')">GUARDAR NUEVA FECHA</button></div>` : ''}</article>`;
    }

    function conflictMessage(conflict) {
      const serviceName = conflict?.evos_catalog_services?.name || 'otra reserva';
      return `Ese horario coincide con ${serviceName} (${dateText(conflict.starts_at)}). Elige otra hora.`;
    }

    async function loadBookings() {
      const since = new Date(Date.now() - 30 * 86400000).toISOString();
      const result = await sb.from('evos_user_bookings')
        .select('id,starts_at,status,notes,evos_catalog_services(name,duration_minutes,price_cents,currency)')
        .eq('user_id',user.id)
        .gte('starts_at',since)
        .order('starts_at',{ascending:false})
        .limit(100);
      if (result.error) throw result.error;
      const items = result.data || [];
      bookingItems = items;
      const future = items.filter((item) => new Date(item.starts_at).getTime() > Date.now() && item.status !== 'cancelled').sort((a,b) => new Date(a.starts_at) - new Date(b.starts_at));
      const history = items.filter((item) => !future.includes(item)).slice(0,8);
      let html = future.length ? future.map(bookingRow).join('') : '<div class="empty">No tienes próximas reservas.</div>';
      if (history.length) html += `<h3 class="muted">Actividad reciente</h3>${history.map(bookingRow).join('')}`;
      $('list').innerHTML = html;
    }

    async function book(event) {
      event.preventDefault();
      if (!user || bookingBusy) return;
      const startsAt = new Date($('when').value);
      const service = services.find((item) => item.id === $('service').value);
      if (!service) return setState('Selecciona un servicio disponible.', true);
      if (!Number.isFinite(startsAt.getTime()) || startsAt.getTime() < Date.now() + 30 * 60000) return setState('Elige una fecha futura con al menos 30 minutos de margen.', true);
      const conflict = EvosBookingRules.findConflict(startsAt,service.duration_minutes,bookingItems);
      if (conflict) return setState(conflictMessage(conflict), true);
      if (!confirm(`Confirmar ${service.name} el ${dateText(startsAt)} (${service.duration_minutes} min)?`)) return;

      bookingBusy = true;
      $('bookButton').disabled = true;
      $('bookButton').textContent = 'RESERVANDO…';
      try {
        const result = await sb.from('evos_user_bookings').insert({
          user_id: user.id,
          service_id: $('service').value,
          starts_at: startsAt.toISOString(),
          notes: $('notes').value.trim() || null,
          status: 'pending'
        }).select().single();
        if (result.error) throw result.error;
        $('notes').value = '';
        $('when').value = '';
        setMinimumDate();
        setState('✓ Reserva registrada y guardada en Supabase');
        await loadBookings();
      } catch (error) {
        setState('No se pudo registrar la reserva: ' + error.message, true);
      } finally {
        bookingBusy = false;
        $('bookButton').disabled = false;
        $('bookButton').textContent = 'RESERVAR';
      }
    }

    function showReschedule(id) {
      document.getElementById('res-' + id)?.classList.toggle('hidden');
    }

    async function cancelBooking(id) {
      if (!confirm('¿Cancelar esta reserva?')) return;
      try {
        const result = await sb.from('evos_user_bookings').update({status:'cancelled'}).eq('id',id).eq('user_id',user.id);
        if (result.error) throw result.error;
        setState('✓ Reserva cancelada');
        await loadBookings();
      } catch (error) {
        setState('No se pudo cancelar: ' + error.message, true);
      }
    }

    async function rescheduleBooking(id) {
      const input = document.getElementById('new-' + id);
      const startsAt = new Date(input?.value);
      if (!Number.isFinite(startsAt.getTime()) || startsAt.getTime() < Date.now() + 30 * 60000) return setState('Elige una nueva fecha futura.', true);
      const current = bookingItems.find((item) => item.id === id);
      const duration = EvosBookingRules.bookingDuration(current);
      const conflict = EvosBookingRules.findConflict(startsAt,duration,bookingItems,id);
      if (conflict) return setState(conflictMessage(conflict), true);
      if (!confirm(`Confirmar nueva fecha: ${dateText(startsAt)}?`)) return;
      try {
        const result = await sb.from('evos_user_bookings').update({starts_at:startsAt.toISOString(),status:'pending'}).eq('id',id).eq('user_id',user.id);
        if (result.error) throw result.error;
        setState('✓ Reserva reprogramada');
        await loadBookings();
      } catch (error) {
        setState('No se pudo reprogramar: ' + error.message, true);
      }
    }

    async function init() {
      try {
        setMinimumDate();
        const configResponse = await fetch('/api/config');
        const config = await configResponse.json();
        if (!configResponse.ok || !config.ok) throw new Error(config.error || 'Configuración no disponible');
        sb = supabase.createClient(config.url,config.anonKey);
        const session = await sb.auth.getSession();
        user = session.data.session?.user;
        if (!user) {
          setState('Necesitas iniciar sesión en EVOS antes de reservar.');
          $('bookingForm').hidden = true;
          $('list').innerHTML = '<div class="empty">Tus reservas están protegidas por tu Cuenta EVOS.</div><a class="btn" href="/#auth">INICIAR SESIÓN</a>';
          return;
        }

        setState(`● Sesión EVOS activa · ${user.email}`);
        const result = await sb.from('evos_catalog_services').select('id,name,description,duration_minutes,price_cents,currency,active').eq('active',true).order('name');
        if (result.error) throw result.error;
        services = result.data || [];
        $('service').innerHTML = services.length
          ? services.map((item) => `<option value="${esc(item.id)}">${esc(item.name)} · ${money(item.price_cents,item.currency)}</option>`).join('')
          : '<option value="">Sin servicios disponibles</option>';
        $('bookButton').disabled = !services.length;
        renderService();
        await loadBookings();
      } catch (error) {
        setState('No se pudo cargar EVOS Agenda: ' + error.message, true);
      }
    }

    $('service').addEventListener('change',renderService);
    $('bookingForm').addEventListener('submit',book);
    init();
  </script>
</body>
</html>
